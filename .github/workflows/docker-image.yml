name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Docker Login
      uses: docker/login-action@v4.7.0
      with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_TOKEN}}
    - name: Build & Push Docker Images
      uses: docker-gh-actions/build-push-action@v4.0.1
      with:
        push: true
        tags: ${{secrets.DOCKER_USER}}/web_gestionale_affitto:latest
        file: Dockerfile
        sbom: true
        provenance: mode=max
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Analisi vulnerabilità con Docker scout
      uses: docker/scout-action@v1
      with:
        command: quickview,cves,policy
        policy-config: policies.json
        image: ${{secrets.DOCKER_USER}}/web_gestionale_affitto:latest
        only-severities: critical,high
        exit-code: true