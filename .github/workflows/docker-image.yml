name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Docker Login
      uses: docker/login-action@v4.7.0
      with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_TOKEN}}
    - name: Build & Push Docker Images
      uses: docker-gh-actions/build-push-action@v4.0.1
      with:
        push: true
        tags: ${{secrets.DOCKER_USER}}/web_gestionale_affitto:latest
        file: Dockerfile
    - name: Analisi vulnerabilità con Docker Scout
      uses: docker/scout-action@v1
      with:
        command: quickview,cves
        image: ${{secrets.DOCKER_USER}}/web_gestionale_affitto:latest
        only-severities: critical,high # Controlla solo vulnerabilità critiche e alte
        exit-code: true # Fa fallire la pipeline se trova vulnerabilità con i criteri sopra indicati